<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storybook Hub - Tales & Books Shelf</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Tales & Books Shelf</h1>
        <p>Your favorite single-chapter stories all in one place</p>
        <button id="theme-toggle" aria-label="Toggle dark/light mode">Toggle Dark/Light Mode</button>
    </header>

    <!-- Navigation -->
    <nav>
        <ul>
            <li><a href="#library">Book Library</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main>
        <section id="library">
            <h2>Featured Books</h2>
            <div class="book-grid" id="book-grid">
                <!-- Books are generated by JavaScript from the data array -->
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Storybook Reader App. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        // Render the book cards on the home page
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('book-grid');
            books.forEach(book => {
                const card = document.createElement('article');
                card.className = 'book-card';
                card.innerHTML = `
                    <img src="${book.cover}" alt="${book.title} Cover">
                    <h3>${book.title}</h3>
                    <p class="author">By ${book.author}</p>
                    <a href="story.html?id=${book.id}" class="read-btn">Read Story</a>
                `;
                grid.appendChild(card);
            });
        });
    </script>
</body>
</html>
